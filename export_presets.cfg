[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="game/data/*.json, game/i18n/*.translation"
exclude_filter="art/*, tools/*, tests/*, build/*, docs/*, test-results/*, playwright-report/*, assets/environment/*, assets/models/*, game/world/locations/*, game/world/dungeons/*, assets/audio/music/music_aubelin.ogg, assets/audio/music/music_boss_morvaine.ogg, assets/audio/music/music_cloister_night.ogg, assets/audio/music/music_combat.ogg, assets/audio/music/music_lantern_mire.ogg, assets/audio/music/music_watch_ruins.ogg, assets/audio/music/music_whispering_wood.ogg, assets/audio/music/sting_*.ogg"
export_path="build/web/index.html"
patches=PackedStringArray()

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

